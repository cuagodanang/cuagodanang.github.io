<!doctype html>
<html lang="vi">
<head>

  <title>Dự án — Cửa Gỗ Đà Nẵng</title>
  <meta name="robots" content="noindex">
  <!-- Link cũ du-an-chi-tiet.html?id=<id> → trang riêng du-an-<id>.html -->

    (function () {
      var id = new URLSearchParams(location.search).get('id') || '';
      location.replace(/^[a-z0-9-]+$/.test(id) ? 'du-an-' + id + '.html' : 'du-an.html');
    })();
  </script>
  <meta http-equiv="refresh" content="2; url=du-an.html">
</head>
<body>
